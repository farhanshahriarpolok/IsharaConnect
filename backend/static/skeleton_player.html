<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IsharaConnect - 2D Landmark Player</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: #1e293b;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.4);
      --text: #f8fafc;
    }
    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .player-card {
      background: var(--panel-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    canvas {
      background: #020617;
      border-radius: 12px;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }
    button {
      background: var(--accent);
      color: #020617;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      box-shadow: 0 0 12px var(--accent-glow);
      transform: translateY(-1px);
    }
    .scrubber {
      flex-grow: 1;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .speed-select {
      background: #0f172a;
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 10px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <div style="font-weight: 700; font-size: 1.1rem; color: var(--accent);">
      BdSL 2D Skeleton Stream: <span id="sign-title" style="color: #fff;">ধন্যবাদ</span>
    </div>

    <canvas id="skeletonCanvas" width="480" height="480"></canvas>

    <div class="controls">
      <button id="playBtn">Play</button>
      <input type="range" id="progressBar" class="scrubber" min="0" value="0" step="1" />
      <span id="frameCounter" style="font-size: 0.85rem; min-width: 55px;">0/0</span>
      <select id="speedSelect" class="speed-select">
        <option value="0.5">0.5x</option>
        <option value="1.0" selected>1.0x</option>
        <option value="1.5">1.5x</option>
        <option value="2.0">2.0x</option>
      </select>
    </div>
  </div>

  <script src="/static/skeleton_player.js"></script>
</body>
</html>
