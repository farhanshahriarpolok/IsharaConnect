<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IsharaConnect - 3D FACS Avatar Viewport</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0a0f1d;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }
    #viewport-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    .hud-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(14px);
      padding: 16px 22px;
      border-radius: 16px;
      border: 1px solid rgba(56, 189, 248, 0.25);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      z-index: 10;
    }
    .hud-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
    }
    .hud-sign {
      font-size: 1.4rem;
      font-weight: 700;
      color: #10b981;
    }
    .hud-stats {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 6px;
    }
    .controls-panel {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      align-items: center;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(14px);
      padding: 10px 16px;
      border-radius: 9999px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      z-index: 10;
    }
    .gloss-input {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
      padding: 8px 18px;
      color: #f8fafc;
      font-size: 0.95rem;
      outline: none;
      width: 260px;
      transition: border-color 0.2s;
    }
    .gloss-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }
    .btn-action {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #020617;
      border: none;
      padding: 8px 20px;
      border-radius: 9999px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .btn-action:hover {
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
      transform: translateY(-1px);
    }
    .btn-action:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
  <!-- Three.js & OrbitControls CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="viewport-container"></div>

  <div class="hud-overlay">
    <div class="hud-badge">BdSL v3 60 FPS FACS Engine</div>
    <div class="hud-sign" id="active-gloss">রেডি (Ready)</div>
    <div class="hud-stats" id="hud-stats">WebSocket: সংযুক্ত হচ্ছে...</div>
  </div>

  <div class="controls-panel">
    <input type="text" id="input-glosses" class="gloss-input" placeholder="বাংলা শব্দ/বাক্য লিখুন (যেমন: ধন্যবাদ)" value="ধন্যবাদ" />
    <button id="btn-synthesize" class="btn-action">সাইন প্লে করুন</button>
  </div>

  <script src="/static/avatar_renderer.js"></script>
</body>
</html>
