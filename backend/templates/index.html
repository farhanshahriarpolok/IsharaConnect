<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IsharaConnect Web Client</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <span class="logo-icon">👐</span>
                <span class="logo-text">IsharaConnect</span>
            </div>
            <div class="status-indicator">
                <span class="status-dot disconnected" id="status-dot"></span>
                <span class="status-text" id="status-text">Disconnected</span>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Camera Section -->
            <div class="video-container glass-panel">
                <div class="video-wrapper">
                    <video id="local-video" autoplay playsinline muted></video>
                    <div class="video-overlay" id="video-overlay">
                        <button class="primary-btn" id="start-btn">
                            <span class="btn-icon">▶</span> Start Interpretation
                        </button>
                    </div>
                </div>
            </div>

            <!-- Translation Output Section -->
            <div class="translation-container glass-panel">
                <div class="translation-header">
                    <h2>Live Translation</h2>
                    <div class="speaker-btn" id="speak-btn" title="Text to Speech">
                        🔊
                    </div>
                </div>
                <div class="output-box" id="output-box">
                    <p class="placeholder-text">Waiting for sign language input...</p>
                </div>
                <div class="gloss-box" id="gloss-box">
                    <span class="gloss-label">Gloss:</span>
                    <span id="gloss-output">-</span>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
