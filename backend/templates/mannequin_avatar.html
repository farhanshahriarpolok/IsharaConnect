<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IsharaConnect - 3D Realistic Mannequin Avatar</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #070b14;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #canvas-container {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
        }
        /* Top Cyber HUD Bar */
        .hud-header {
            position: absolute;
            top: 16px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }
        .hud-title {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            padding: 8px 18px;
            border-radius: 12px;
            border: 1px solid rgba(59, 130, 246, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .status-dot {
            width: 10px;
            height: 10px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* Bottom Floating Control Bar */
        .playback-card {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(59, 130, 246, 0.35);
            border-radius: 16px;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7);
            z-index: 10;
        }
        select, button {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #334155;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        select:hover, button:hover {
            background: #3b82f6;
            border-color: #60a5fa;
            color: #fff;
            transform: translateY(-1px);
        }
        button.active {
            background: #2563eb;
            border-color: #60a5fa;
            box-shadow: 0 0 12px rgba(37, 99, 235, 0.5);
        }
        .scrubber-container {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 160px;
        }
        input[type=range] {
            flex: 1;
            accent-color: #3b82f6;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <div class="hud-header">
            <div class="hud-title">
                <div class="status-dot"></div>
                <span style="font-size: 14px; letter-spacing: 0.5px;">৩ডি জীবন্ত অ্যাকশন অবতার • BdSL Engine</span>
            </div>
            <div style="pointer-events: auto;">
                <button id="btn-camera-toggle">🔍 হাত জুম (2x Focus)</button>
            </div>
        </div>

        <div class="playback-card">
            <select id="sign-selector">
                <option value="police">👮 পুলিশ / সাহায্য (Uniform Pose)</option>
                <option value="thank_you">🙏 ধন্যবাদ (Thank You)</option>
                <option value="mother">👩 মা (Mother)</option>
                <option value="father">👨 বাবা (Father)</option>
                <option value="doctor">🩺 ডাক্তার (Doctor)</option>
                <option value="salam">🤲 সালাম (Salam)</option>
            </select>

            <button id="btn-play-pause">⏸️ পজ</button>

            <div class="scrubber-container">
                <input type="range" id="frame-scrubber" min="0" max="100" value="0">
            </div>

            <div style="display: flex; gap: 4px;">
                <button class="speed-btn" data-speed="0.25">0.25x</button>
                <button class="speed-btn" data-speed="0.5">0.5x</button>
                <button class="speed-btn active" data-speed="1.0">1.0x</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. SCENE SETUP & CINEMATIC STUDIO LIGHTING
        // ==========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a1122); // Deep studio blue

        const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.45, 2.3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1.35, 0);
        controls.enableDamping = true;
        controls.maxDistance = 4;
        controls.minDistance = 0.8;
        controls.maxPolarAngle = Math.PI / 2 + 0.1;

        // --- Studio Lighting Matching the Reference Image ---
        // 1. Key Warm Light (Front-Right)
        const keyLight = new THREE.DirectionalLight(0xfffaed, 1.3);
        keyLight.position.set(2, 3, 2.5);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 2048;
        keyLight.shadow.mapSize.height = 2048;
        keyLight.shadow.bias = -0.0001;
        scene.add(keyLight);

        // 2. Strong Cyan/Blue Rim Light (Back-Left - Exactly as reference photo)
        const rimLight = new THREE.DirectionalLight(0x38bdf8, 3.2);
        rimLight.position.set(-2.5, 2.5, -2.0);
        scene.add(rimLight);

        // 3. Subtle Fill Light
        const fillLight = new THREE.DirectionalLight(0x64748b, 0.6);
        fillLight.position.set(-2, 1, 2);
        scene.add(fillLight);

        // 4. Soft Ambient Studio Light
        const ambientLight = new THREE.AmbientLight(0x1e293b, 0.9);
        scene.add(ambientLight);

        // ==========================================
        // 2. PROCEDURAL REALISTIC MANNEQUIN MESH
        // ==========================================
        // Materials
        const skinMaterial = new THREE.MeshStandardMaterial({
            color: 0xd2a679, // Realistic warm beige mannequin skin
            roughness: 0.38,
            metalness: 0.05,
            flatShading: false
        });

        const uniformMaterial = new THREE.MeshStandardMaterial({
            color: 0x0f172a, // Dark Navy / Black Officer Uniform
            roughness: 0.85,
            metalness: 0.1
        });

        const epauletMaterial = new THREE.MeshStandardMaterial({
            color: 0x991b1b, // Deep Red Shoulder Stripe
            roughness: 0.5
        });

        const badgeMaterial = new THREE.MeshStandardMaterial({
            color: 0xf59e0b, // Gold Emblem Badge
            metalness: 0.8,
            roughness: 0.2
        });

        const avatarRoot = new THREE.Group();
        scene.add(avatarRoot);

        // --- Head & Face Sculpt ---
        const headGroup = new THREE.Group();
        headGroup.position.set(0, 1.48, 0);

        // Cranium / Skull
        const craniumGeo = new THREE.SphereGeometry(0.12, 32, 32);
        craniumGeo.scale(0.95, 1.25, 1.05);
        const cranium = new THREE.Mesh(craniumGeo, skinMaterial);
        cranium.castShadow = true;
        headGroup.add(cranium);

        // Stylized Jawline & Chin
        const jawGeo = new THREE.CylinderGeometry(0.065, 0.045, 0.12, 16);
        jawGeo.scale(1.1, 1.0, 0.9);
        const jaw = new THREE.Mesh(jawGeo, skinMaterial);
        jaw.position.set(0, -0.06, 0.025);
        jaw.rotation.x = 0.25;
        headGroup.add(jaw);

        // Nose Bridge & Tip
        const noseGeo = new THREE.ConeGeometry(0.016, 0.045, 8);
        const nose = new THREE.Mesh(noseGeo, skinMaterial);
        nose.position.set(0, 0.005, 0.125);
        nose.rotation.x = -Math.PI / 2.3;
        headGroup.add(nose);

        // Eyebrows / Brow Ridge
        const browGeo = new THREE.BoxGeometry(0.14, 0.014, 0.03);
        const brow = new THREE.Mesh(browGeo, skinMaterial);
        brow.position.set(0, 0.04, 0.105);
        headGroup.add(brow);

        // Neck
        const neckGeo = new THREE.CylinderGeometry(0.065, 0.08, 0.18, 24);
        const neck = new THREE.Mesh(neckGeo, skinMaterial);
        neck.position.set(0, -0.14, -0.01);
        headGroup.add(neck);

        avatarRoot.add(headGroup);

        // --- Upper Torso & Black Uniform Jacket ---
        const torsoGroup = new THREE.Group();
        torsoGroup.position.set(0, 1.05, 0);

        const chestGeo = new THREE.CylinderGeometry(0.24, 0.19, 0.46, 24);
        chestGeo.scale(1.2, 1.0, 0.75);
        const chest = new THREE.Mesh(chestGeo, uniformMaterial);
        chest.castShadow = true;
        torsoGroup.add(chest);

        // Stand Collar
        const collarGeo = new THREE.CylinderGeometry(0.095, 0.11, 0.08, 24);
        const collar = new THREE.Mesh(collarGeo, uniformMaterial);
        collar.position.set(0, 0.24, -0.01);
        torsoGroup.add(collar);

        // Red Shoulder Epaulets (Left & Right)
        [-0.26, 0.26].forEach((xOffset, idx) => {
            const epauletGeo = new THREE.BoxGeometry(0.1, 0.018, 0.14);
            const epaulet = new THREE.Mesh(epauletGeo, epauletMaterial);
            epaulet.position.set(xOffset, 0.22, 0);
            epaulet.rotation.z = idx === 0 ? 0.12 : -0.12;
            torsoGroup.add(epaulet);
        });

        // Gold Shield Badge on Left Chest
        const badgeGeo = new THREE.CylinderGeometry(0.025, 0.012, 0.008, 6);
        const badge = new THREE.Mesh(badgeGeo, badgeMaterial);
        badge.position.set(0.14, 0.08, 0.17);
        badge.rotation.x = Math.PI / 2.2;
        badge.rotation.z = 0.2;
        torsoGroup.add(badge);

        avatarRoot.add(torsoGroup);

        // ==========================================
        // 3. ARTICULATED 5-FINGER HAND & ARM RIG
        // ==========================================
        function createHandRig(isRight = true) {
            const handRoot = new THREE.Group();
            const signX = isRight ? 1 : -1;

            // Palm
            const palmGeo = new THREE.BoxGeometry(0.055, 0.075, 0.022);
            const palm = new THREE.Mesh(palmGeo, skinMaterial);
            palm.castShadow = true;
            handRoot.add(palm);

            const fingers = {};
            const fingerConfigs = [
                { name: 'thumb',  x: 0.032 * signX, y: -0.01, z: 0.008, scale: 0.85, rotZ: 0.45 * signX },
                { name: 'index',  x: 0.020 * signX, y: 0.042, z: 0.0, scale: 1.0 },
                { name: 'middle', x: 0.007 * signX, y: 0.046, z: 0.0, scale: 1.08 },
                { name: 'ring',   x: -0.007 * signX, y: 0.041, z: 0.0, scale: 0.96 },
                { name: 'pinky',  x: -0.021 * signX, y: 0.034, z: 0.0, scale: 0.78 }
            ];

            fingerConfigs.forEach(cfg => {
                const fBase = new THREE.Group();
                fBase.position.set(cfg.x, cfg.y, cfg.z);
                if (cfg.rotZ) fBase.rotation.z = cfg.rotZ;

                // Proximal Phalanx
                const phalanx1Geo = new THREE.CylinderGeometry(0.0065, 0.007, 0.025 * cfg.scale, 10);
                const phalanx1 = new THREE.Mesh(phalanx1Geo, skinMaterial);
                phalanx1.position.y = (0.025 * cfg.scale) / 2;
                phalanx1.castShadow = true;
                fBase.add(phalanx1);

                // Intermediate Joint & Tip
                const fMid = new THREE.Group();
                fMid.position.y = 0.025 * cfg.scale;

                const phalanx2Geo = new THREE.CylinderGeometry(0.0055, 0.0065, 0.022 * cfg.scale, 10);
                const phalanx2 = new THREE.Mesh(phalanx2Geo, skinMaterial);
                phalanx2.position.y = (0.022 * cfg.scale) / 2;
                phalanx2.castShadow = true;
                fMid.add(phalanx2);

                fBase.add(fMid);
                handRoot.add(fBase);

                fingers[cfg.name] = { base: fBase, mid: fMid };
            });

            return { root: handRoot, fingers: fingers };
        }

        // Arm Builders
        function createArm(isRight = true) {
            const signX = isRight ? 1 : -1;
            const shoulderJoint = new THREE.Group();
            shoulderJoint.position.set(0.28 * signX, 1.25, 0);

            // Upper Arm
            const upperArmMesh = new THREE.Mesh(
                new THREE.CylinderGeometry(0.05, 0.042, 0.28, 16),
                uniformMaterial
            );
            upperArmMesh.position.y = -0.14;
            shoulderJoint.add(upperArmMesh);

            // Elbow Joint
            const elbowJoint = new THREE.Group();
            elbowJoint.position.set(0, -0.28, 0);

            // Forearm
            const forearmMesh = new THREE.Mesh(
                new THREE.CylinderGeometry(0.042, 0.034, 0.26, 16),
                uniformMaterial
            );
            forearmMesh.position.y = -0.13;
            elbowJoint.add(forearmMesh);

            // Wrist Joint
            const wristJoint = new THREE.Group();
            wristJoint.position.set(0, -0.26, 0);

            const hand = createHandRig(isRight);
            wristJoint.add(hand.root);
            elbowJoint.add(wristJoint);
            shoulderJoint.add(elbowJoint);
            avatarRoot.add(shoulderJoint);

            return {
                shoulder: shoulderJoint,
                elbow: elbowJoint,
                wrist: wristJoint,
                hand: hand
            };
        }

        const rightArm = createArm(true);
        const leftArm = createArm(false);

        // ==========================================
        // 4. SIGN KEYFRAMES & BEZIER KINEMATICS
        // ==========================================
        const signPoses = {
            // 1. Reference Photo Uniform/Police Sign Pose
            police: {
                rShoulder: { x: 0.45, y: -0.25, z: 0.35 },
                rElbow:    { x: -1.45, y: 0.65, z: 0.15 },
                rWrist:    { x: 0.35, y: 0.20, z: -0.20 },
                rFingers:  { thumb: 0.3, index: 1.1, middle: 1.2, ring: 1.3, pinky: 1.3 },
                lShoulder: { x: 0.1, y: 0.0, z: -0.1 },
                lElbow:    { x: -0.3, y: 0.0, z: 0.0 },
                lWrist:    { x: 0.0, y: 0.0, z: 0.0 },
                lFingers:  { thumb: 0.1, index: 0.1, middle: 0.1, ring: 0.1, pinky: 0.1 }
            },
            // 2. Thank You (ধন্যবাদ - Chin Contact to Chest Arc)
            thank_you: {
                rShoulder: { x: 0.65, y: -0.3, z: 0.45 },
                rElbow:    { x: -1.65, y: 0.85, z: 0.1 },
                rWrist:    { x: 0.55, y: 0.3, z: -0.15 },
                rFingers:  { thumb: 0.0, index: 0.0, middle: 0.0, ring: 0.0, pinky: 0.0 }, // Flat Palm
                lShoulder: { x: 0.05, y: 0.0, z: -0.05 },
                lElbow:    { x: -0.2, y: 0.0, z: 0.0 },
                lWrist:    { x: 0.0, y: 0.0, z: 0.0 },
                lFingers:  { thumb: 0.1, index: 0.1, middle: 0.1, ring: 0.1, pinky: 0.1 }
            },
            // 3. Mother (মা - Cheek Tap)
            mother: {
                rShoulder: { x: 0.75, y: -0.15, z: 0.55 },
                rElbow:    { x: -1.85, y: 0.95, z: 0.25 },
                rWrist:    { x: 0.45, y: 0.4, z: -0.25 },
                rFingers:  { thumb: 0.8, index: 0.0, middle: 1.3, ring: 1.4, pinky: 1.4 }, // Index extended
                lShoulder: { x: 0.05, y: 0.0, z: -0.05 },
                lElbow:    { x: -0.2, y: 0.0, z: 0.0 },
                lWrist:    { x: 0.0, y: 0.0, z: 0.0 },
                lFingers:  { thumb: 0.1, index: 0.1, middle: 0.1, ring: 0.1, pinky: 0.1 }
            },
            // 4. Father (বাবা - Mustache Pinch)
            father: {
                rShoulder: { x: 0.60, y: -0.20, z: 0.40 },
                rElbow:    { x: -1.70, y: 0.75, z: 0.15 },
                rWrist:    { x: 0.40, y: 0.25, z: -0.10 },
                rFingers:  { thumb: 0.9, index: 0.85, middle: 1.3, ring: 1.4, pinky: 1.4 }, // Pinch
                lShoulder: { x: 0.05, y: 0.0, z: -0.05 },
                lElbow:    { x: -0.2, y: 0.0, z: 0.0 },
                lWrist:    { x: 0.0, y: 0.0, z: 0.0 },
                lFingers:  { thumb: 0.1, index: 0.1, middle: 0.1, ring: 0.1, pinky: 0.1 }
            },
            // 5. Salam (সালাম - Forehead Arc)
            salam: {
                rShoulder: { x: 0.85, y: -0.20, z: 0.50 },
                rElbow:    { x: -1.95, y: 0.90, z: 0.10 },
                rWrist:    { x: 0.30, y: 0.15, z: -0.10 },
                rFingers:  { thumb: 0.0, index: 0.0, middle: 0.0, ring: 0.0, pinky: 0.0 },
                lShoulder: { x: 0.05, y: 0.0, z: -0.05 },
                lElbow:    { x: -0.2, y: 0.0, z: 0.0 },
                lWrist:    { x: 0.0, y: 0.0, z: 0.0 },
                lFingers:  { thumb: 0.1, index: 0.1, middle: 0.1, ring: 0.1, pinky: 0.1 }
            },
            // 6. Doctor (ডাক্তার - Wrist Pulse Check)
            doctor: {
                lShoulder: { x: 0.35, y: 0.1, z: 0.2 },
                lElbow:    { x: -1.1, y: 0.4, z: 0.0 },
                lWrist:    { x: 0.2, y: 0.0, z: 0.0 },
                lFingers:  { thumb: 0.2, index: 0.2, middle: 0.2, ring: 0.2, pinky: 0.2 },
                rShoulder: { x: 0.45, y: -0.1, z: 0.3 },
                rElbow:    { x: -1.25, y: 0.55, z: 0.1 },
                rWrist:    { x: 0.15, y: 0.1, z: 0.0 },
                rFingers:  { thumb: 0.8, index: 0.0, middle: 0.0, ring: 1.2, pinky: 1.2 }
            }
        };

        // Smooth Interpolation helper
        function lerp(a, b, t) { return a + (b - a) * t; }

        function applyPose(pose, blendFactor = 1.0) {
            // Right Arm
            rightArm.shoulder.rotation.x = lerp(rightArm.shoulder.rotation.x, pose.rShoulder.x, blendFactor);
            rightArm.shoulder.rotation.y = lerp(rightArm.shoulder.rotation.y, pose.rShoulder.y, blendFactor);
            rightArm.shoulder.rotation.z = lerp(rightArm.shoulder.rotation.z, pose.rShoulder.z, blendFactor);

            rightArm.elbow.rotation.x = lerp(rightArm.elbow.rotation.x, pose.rElbow.x, blendFactor);
            rightArm.elbow.rotation.y = lerp(rightArm.elbow.rotation.y, pose.rElbow.y, blendFactor);
            rightArm.elbow.rotation.z = lerp(rightArm.elbow.rotation.z, pose.rElbow.z, blendFactor);

            rightArm.wrist.rotation.x = lerp(rightArm.wrist.rotation.x, pose.rWrist.x, blendFactor);
            rightArm.wrist.rotation.y = lerp(rightArm.wrist.rotation.y, pose.rWrist.y, blendFactor);
            rightArm.wrist.rotation.z = lerp(rightArm.wrist.rotation.z, pose.rWrist.z, blendFactor);

            // Left Arm
            leftArm.shoulder.rotation.x = lerp(leftArm.shoulder.rotation.x, pose.lShoulder.x, blendFactor);
            leftArm.shoulder.rotation.y = lerp(leftArm.shoulder.rotation.y, pose.lShoulder.y, blendFactor);
            leftArm.shoulder.rotation.z = lerp(leftArm.shoulder.rotation.z, pose.lShoulder.z, blendFactor);

            leftArm.elbow.rotation.x = lerp(leftArm.elbow.rotation.x, pose.lElbow.x, blendFactor);
            leftArm.elbow.rotation.y = lerp(leftArm.elbow.rotation.y, pose.lElbow.y, blendFactor);
            leftArm.elbow.rotation.z = lerp(leftArm.elbow.rotation.z, pose.lElbow.z, blendFactor);

            // Right Fingers Curl
            Object.keys(pose.rFingers).forEach(fKey => {
                const curl = pose.rFingers[fKey];
                const f = rightArm.hand.fingers[fKey];
                if (f) {
                    f.base.rotation.x = lerp(f.base.rotation.x, curl, blendFactor);
                    f.mid.rotation.x = lerp(f.mid.rotation.x, curl * 1.2, blendFactor);
                }
            });

            // Left Fingers Curl
            Object.keys(pose.lFingers).forEach(fKey => {
                const curl = pose.lFingers[fKey];
                const f = leftArm.hand.fingers[fKey];
                if (f) {
                    f.base.rotation.x = lerp(f.base.rotation.x, curl, blendFactor);
                    f.mid.rotation.x = lerp(f.mid.rotation.x, curl * 1.2, blendFactor);
                }
            });
        }

        // ==========================================
        // 5. ANIMATION LOOP & INTERACTIVE HUD
        // ==========================================
        let currentSign = 'police';
        let isPlaying = true;
        let playbackSpeed = 1.0;
        let animProgress = 0.0;
        let isZoomed = false;

        const scrubber = document.getElementById('frame-scrubber');
        const playBtn = document.getElementById('btn-play-pause');
        const signSelector = document.getElementById('sign-selector');
        const zoomBtn = document.getElementById('btn-camera-toggle');

        signSelector.addEventListener('change', (e) => {
            currentSign = e.target.value;
            animProgress = 0.0;
        });

        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            playBtn.innerHTML = isPlaying ? '⏸️ পজ' : '▶️ প্লে';
        });

        document.querySelectorAll('.speed-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                playbackSpeed = parseFloat(btn.dataset.speed);
            });
        });

        scrubber.addEventListener('input', (e) => {
            isPlaying = false;
            playBtn.innerHTML = '▶️ প্লে';
            animProgress = parseFloat(e.target.value) / 100.0;
        });

        zoomBtn.addEventListener('click', () => {
            isZoomed = !isZoomed;
            zoomBtn.innerHTML = isZoomed ? '👤 ফুল ভিউ (Full Body)' : '🔍 হাত জুম (2x Focus)';
            zoomBtn.classList.toggle('active', isZoomed);
        });

        // 60 FPS Render Loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (isPlaying) {
                animProgress = (animProgress + (delta * 0.7 * playbackSpeed)) % 1.0;
                scrubber.value = animProgress * 100;
            }

            // Continuous Dynamic Organic Breathing & Motion Oscillation
            const oscillation = Math.sin(animProgress * Math.PI * 2);
            torsoGroup.position.y = 1.05 + Math.sin(clock.getElapsedTime() * 1.5) * 0.004; // Micro-breathing

            const targetPose = signPoses[currentSign] || signPoses.police;
            
            // Dynamic motion modifier based on active sign
            const activePose = JSON.parse(JSON.stringify(targetPose));
            if (currentSign === 'thank_you') {
                // Arc downward from chin to chest
                activePose.rWrist.x += oscillation * 0.25;
                activePose.rElbow.x -= oscillation * 0.35;
            } else if (currentSign === 'mother' || currentSign === 'doctor') {
                // Double tap pulse
                activePose.rElbow.x += Math.sin(animProgress * Math.PI * 4) * 0.12;
            } else if (currentSign === 'police') {
                // Subtle chest radio talk pulse
                activePose.rWrist.z += oscillation * 0.08;
            }

            applyPose(activePose, 0.15);

            // Smooth Camera Zoom Transition
            const targetCamZ = isZoomed ? 1.2 : 2.3;
            const targetCamY = isZoomed ? 1.32 : 1.45;
            const targetCamX = isZoomed ? 0.25 : 0.0;
            camera.position.z = lerp(camera.position.z, targetCamZ, 0.08);
            camera.position.y = lerp(camera.position.y, targetCamY, 0.08);
            camera.position.x = lerp(camera.position.x, targetCamX, 0.08);

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Responsive Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
