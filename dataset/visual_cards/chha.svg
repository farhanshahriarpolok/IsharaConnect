<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" width="300" height="260">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Glassmorphic Container -->
  <rect width="296" height="256" x="2" y="2" rx="16" fill="url(#cardBg)" stroke="url(#borderGlow)" stroke-width="2" />
  
  <!-- Category & Handedness Header Badges -->
  <rect x="12" y="12" width="75" height="20" rx="6" fill="#1E293B" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
  <text x="49" y="26" fill="#38BDF8" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">General</text>

  <rect x="213" y="12" width="75" height="20" rx="6" fill="#1E293B" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
  <text x="250" y="26" fill="#10B981" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Single Hand</text>

  <!-- Prominent Bengali Sign Glyph -->
  <text x="150" y="58" fill="#F8FAFC" font-family="'SolaimanLipi', 'Segoe UI', Arial, sans-serif" font-size="38" font-weight="900" text-anchor="middle" filter="url(#glow)">ছ</text>

  <!-- English Label & Subtitle -->
  <text x="150" y="80" fill="#94A3B8" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Chha</text>

  <!-- Anatomical Hand Gesture Silhouette -->
  <g id="hand_anatomy">
    <path d="M 131.1,180.0 Q 150.0,184.2 168.9,180.0 Q 177.3,150.0 171.0,125.4 Q 150.0,121.2 131.1,125.4 Q 120.6,156.3 131.1,180.0 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="2" stroke-linejoin="round" />
    <path d="M 134.2,144.8 Q 150.0,160.5 162.6,165.8" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" stroke-linecap="round" />
    <line x1="133.2" y1="186.3" x2="166.8" y2="186.3" stroke="rgba(148, 163, 184, 0.4)" stroke-width="2" stroke-dasharray="3,3" />
    <line x1="124.8" y1="139.5" x2="100.9" y2="113.0" stroke="#38BDF8" stroke-width="6.8" stroke-linecap="round" />
    <line x1="124.8" y1="139.5" x2="100.9" y2="113.0" stroke="#1E293B" stroke-width="4.3" stroke-linecap="round" />
    <circle cx="114.1" cy="127.6" r="2.6" fill="#10B981" />
    <circle cx="100.9" cy="113.0" r="3.7" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1" />
    <line x1="133.2" y1="128.2" x2="118.9" y2="84.2" stroke="#38BDF8" stroke-width="6.8" stroke-linecap="round" />
    <line x1="133.2" y1="128.2" x2="118.9" y2="84.2" stroke="#1E293B" stroke-width="4.3" stroke-linecap="round" />
    <circle cx="126.8" cy="108.4" r="2.6" fill="#10B981" />
    <circle cx="118.9" cy="84.2" r="3.7" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1" />
    <line x1="148.9" y1="128.2" x2="148.9" y2="75.7" stroke="#38BDF8" stroke-width="6.8" stroke-linecap="round" />
    <line x1="148.9" y1="128.2" x2="148.9" y2="75.7" stroke="#1E293B" stroke-width="4.3" stroke-linecap="round" />
    <circle cx="148.9" cy="104.5" r="2.6" fill="#10B981" />
    <circle cx="148.9" cy="75.7" r="3.7" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="167.9" cy="118.2" r="5.8" fill="#0F172A" stroke="rgba(148, 163, 184, 0.6)" stroke-width="2" />
    <circle cx="167.9" cy="118.2" r="2.1" fill="#64748B" />
    <circle cx="181.4" cy="119.7" r="5.8" fill="#0F172A" stroke="rgba(148, 163, 184, 0.6)" stroke-width="2" />
    <circle cx="181.4" cy="119.7" r="2.1" fill="#64748B" />
    
  </g>

  <!-- Footer Posture Cue / Hint -->
  <rect x="16" y="232" width="268" height="18" rx="5" fill="#1E293B" />
  <text x="150" y="245" fill="#CBD5E1" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="500" text-anchor="middle">নির্দিষ্ট অঙ্গুলি নির্দেশক ভঙ্গি</text>
</svg>