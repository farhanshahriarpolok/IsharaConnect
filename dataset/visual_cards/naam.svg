<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" width="300" height="260">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Glassmorphic Container -->
  <rect width="296" height="256" x="2" y="2" rx="16" fill="url(#cardBg)" stroke="url(#borderGlow)" stroke-width="2" />
  
  <!-- Category & Handedness Header Badges -->
  <rect x="12" y="12" width="75" height="20" rx="6" fill="#1E293B" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
  <text x="49" y="26" fill="#38BDF8" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Dynamic</text>

  <rect x="213" y="12" width="75" height="20" rx="6" fill="#1E293B" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
  <text x="250" y="26" fill="#10B981" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Dual Hand</text>

  <!-- Prominent Bengali Sign Glyph -->
  <text x="150" y="58" fill="#F8FAFC" font-family="'SolaimanLipi', 'Segoe UI', Arial, sans-serif" font-size="38" font-weight="900" text-anchor="middle" filter="url(#glow)">নাম</text>

  <!-- English Label & Subtitle -->
  <text x="150" y="80" fill="#94A3B8" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Name</text>

