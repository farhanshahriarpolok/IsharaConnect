version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: isharaconnect_backend_dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-ishara}:${POSTGRES_PASSWORD:-ishara_secret}@db:5432/${POSTGRES_DB:-isharaconnect}
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./models:/app/models
      - ./dataset:/app/dataset
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    networks:
      - ishara_dev_network

  db:
    image: postgres:16-alpine
    container_name: isharaconnect_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ishara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ishara_secret}
      POSTGRES_DB: ${POSTGRES_DB:-isharaconnect}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ishara} -d ${POSTGRES_DB:-isharaconnect}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ishara_dev_network

  redis:
    image: redis:7-alpine
    container_name: isharaconnect_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - ishara_dev_network

volumes:
  postgres_dev_data:
  redis_dev_data:

networks:
  ishara_dev_network:
    driver: bridge
