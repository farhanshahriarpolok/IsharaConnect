name: isharaconnect_mobile
description: "IsharaConnect - Real-Time Bangla Sign Language (BdSL) Two-Way Mobile Communication Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  tflite_flutter: ^0.10.4
  web_socket_channel: ^2.4.1
  google_fonts: ^6.1.0
  audioplayers: ^5.2.1
  shared_preferences: ^2.2.2
  flutter_svg: ^2.0.9
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/curriculum/
    - assets/images/
